name: Build WaveAA release APKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Validate update manifests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          gradle = Path("smarttubetv/build.gradle").read_text(encoding="utf-8")
          code = int(re.search(r"^\s*versionCode (\d+)$", gradle, re.MULTILINE)[1])
          tag = re.search(r'versionNameSuffix "-mobile-p13-(aa\d+\.\d+)"', gradle)[1]
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}"
          for channel, variant, key in [
              ("music", "Music", tag),
              ("video-exp", "Video-EXP", f"{tag}-video-exp"),
          ]:
              path = Path(f"updates/{channel}.json")
              data = json.loads(path.read_text(encoding="utf-8"))
              package = data.pop("package")
              expected_url = f"{base}/SmartTube-AA-{variant}-{tag}-arm64-v8a.apk"
              assert data[key]["versionCode"] == code, path
              assert max(item["versionCode"] for item in data.values()) == code, path
              assert package["downloadUrl"] == expected_url, path
              assert package["downloadUrlList_arm64-v8a"] == [expected_url], path
              print(f"OK: {path} -> {expected_url}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              print(f"RELEASE_TAG={tag}", file=env)
          PY

      - name: Apply aa1.41 production patches
        run: |
          set -euxo pipefail
          python3 .github/aa140_apply_vod_eos_guard.py
          python3 .github/aa141_apply_lockscreen_media_controls.py
          grep -n 'ACTION_SKIP_TO_PREVIOUS\|ACTION_SKIP_TO_NEXT' smarttubetv/src/stmobile/java/com/liskovsoft/smartyoutubetv2/tv/ui/mobile/nativeui/background/MobileMediaSessionManager.java
          grep -n 'if (periodEnded && loadPositionUs >= periodDurationUs)' exoplayer-amzn-2.10.6/library/sabr/src/main/java/com/google/android/exoplayer2/source/sabr/DefaultSabrChunkSource.java
          grep -n 'BACKOFF_MARKER' exoplayer-amzn-2.10.6/library/sabr/src/main/java/com/google/android/exoplayer2/source/sabr/parser/misc/SabrExtractorInput.java
          grep -n 'BACKOFF_MARKER' common/src/main/java/com/liskovsoft/smartyoutubetv2/common/exoplayer/errors/SabrDefaultLoadErrorHandlingPolicy.java

      - name: Set up Java 11
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Restore stable SmartTube AA signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SMARTTUBE_AA_SIGNING_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "${SIGNING_KEYSTORE_B64:-}"
          KEYSTORE="$RUNNER_TEMP/smarttube-aa-signing.keystore"
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          EXPECTED_FP="50:B0:29:CB:A8:6A:91:58:51:B0:64:0C:B0:DF:42:83:BB:EE:12:EA:7E:DB:C0:06:1C:9B:D4:C6:1C:0E:C9:C5"
          ACTUAL_FP="$(keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey | awk -F'SHA256: ' '/SHA256:/{print $2; exit}')"
          echo "Signing certificate SHA-256: $ACTUAL_FP"
          test "$ACTUAL_FP" = "$EXPECTED_FP"

          cat > keystore.properties <<EOF
          storeFile=$KEYSTORE
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF
          chmod 600 keystore.properties

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Music and Video EXP production APKs
        run: >-
          ./gradlew :smarttubetv:assembleStmobileDebug :smarttubetv:assembleStmobileCarvideo
          --stacktrace
          --console=plain
          --no-daemon
          --max-workers=1
          --no-parallel

      - name: Prepare production ARM64 APKs
        run: |
          set -euxo pipefail
          MUSIC_OUT=smarttubetv/build/outputs/apk/stmobile/debug
          VIDEO_OUT=smarttubetv/build/outputs/apk/stmobile/carvideo
          mkdir -p production-apk
          cp "$(find "$MUSIC_OUT" -maxdepth 1 -type f -name '*_arm64-v8a.apk' -print -quit)" "production-apk/SmartTube-AA-Music-${RELEASE_TAG}-arm64-v8a.apk"
          cp "$(find "$VIDEO_OUT" -maxdepth 1 -type f -name '*_arm64-v8a.apk' -print -quit)" "production-apk/SmartTube-AA-Video-EXP-${RELEASE_TAG}-arm64-v8a.apk"
          ls -lh production-apk

      - name: Verify production signing certificate
        run: |
          set -euo pipefail
          EXPECTED_FP="50:B0:29:CB:A8:6A:91:58:51:B0:64:0C:B0:DF:42:83:BB:EE:12:EA:7E:DB:C0:06:1C:9B:D4:C6:1C:0E:C9:C5"
          for APK in production-apk/*.apk; do
            ACTUAL_FP="$(keytool -printcert -jarfile "$APK" | awk -F'SHA256: ' '/SHA256:/{print $2; exit}')"
            echo "$APK -> $ACTUAL_FP"
            test "$ACTUAL_FP" = "$EXPECTED_FP"
          done

      - name: Upload signed release APKs for device testing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: waveaa-release-apks
          if-no-files-found: error
          path: production-apk/*.apk
