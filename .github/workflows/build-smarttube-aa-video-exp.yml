name: Build SmartTube AA Video EXP APK

on:
  workflow_dispatch:
  push:
    branches:
      - "main"

permissions:
  contents: write

jobs:
  build-video-exp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout public monorepo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Verify unified settings and aa1.39 multi-audio prerequisites
        run: |
          set -euxo pipefail
          grep -n 'CUSTOM_PREFIX\|submitUnifiedSettings' smarttubetv/src/stmobile/java/com/liskovsoft/smartyoutubetv2/tv/ui/mobile/nativeui/fragment/MobileSettingsFragment.java
          test "$(grep -c '<androidx.recyclerview.widget.RecyclerView' smarttubetv/src/stmobile/res/layout/mobile_native_fragment_settings.xml)" -eq 1
          ! grep -q 'mobile_android_auto_button' smarttubetv/src/stmobile/res/layout/mobile_native_fragment_settings.xml

      - name: Apply same aa1.39 playback and multi-audio fix used by Music
        run: |
          set -euxo pipefail
          AUTH_FILE=MediaServiceCore/youtubeapi/src/main/java/com/liskovsoft/youtubeapi/service/YouTubeSignInService.java
          AUTH_BEFORE=$(sha256sum "$AUTH_FILE" | awk '{print $1}')
          python3 .github/aa139_apply_cross_track_init.py
          AUTH_AFTER=$(sha256sum "$AUTH_FILE" | awk '{print $1}')
          test "$AUTH_BEFORE" = "$AUTH_AFTER"

          grep -n 'audioTrack: AudioTrack\|val xtags' MediaServiceCore/youtubeapi/src/main/java/com/liskovsoft/youtubeapi/innertube/models/PlayerResult.kt
          grep -n 'getAudioTrackId' MediaServiceCore/mediaserviceinterfaces/src/main/java/com/liskovsoft/mediaserviceinterfaces/data/MediaFormat.java
          grep -n 'SabrFormatMetadata' exoplayer-amzn-2.10.6/library/sabr/src/main/java/com/google/android/exoplayer2/source/sabr/manifest/SabrManifestParser.java
          grep -n 'getAudioTrackId(selectedAudioFormat)' exoplayer-amzn-2.10.6/library/sabr/src/main/java/com/google/android/exoplayer2/source/sabr/manifest/SabrManifest.java
          grep -n 'audioLogicalKey\|displayLanguage' smarttubetv/src/stmobile/java/com/liskovsoft/smartyoutubetv2/tv/ui/mobile/nativeui/legacy/LegacyTrackMapper.java
          grep -n 'EnabledTrackTypes.VIDEO_ONLY : EnabledTrackTypes.AUDIO_ONLY' exoplayer-amzn-2.10.6/library/sabr/src/main/java/com/google/android/exoplayer2/source/sabr/manifest/SabrManifest.java
          ! grep -n 'EnabledTrackTypes.VIDEO_AND_AUDIO' exoplayer-amzn-2.10.6/library/sabr/src/main/java/com/google/android/exoplayer2/source/sabr/manifest/SabrManifest.java
          grep -n 'return emptySelector;' exoplayer-amzn-2.10.6/library/sabr/src/main/java/com/google/android/exoplayer2/source/sabr/parser/SabrProcessor.java

      - name: Set up Java 11
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Restore stable SmartTube AA signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SMARTTUBE_AA_SIGNING_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "${SIGNING_KEYSTORE_B64:-}"
          KEYSTORE="$RUNNER_TEMP/smarttube-aa-signing.keystore"
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          EXPECTED_FP="50:B0:29:CB:A8:6A:91:58:51:B0:64:0C:B0:DF:42:83:BB:EE:12:EA:7E:DB:C0:06:1C:9B:D4:C6:1C:0E:C9:C5"
          ACTUAL_FP="$(keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey | awk -F'SHA256: ' '/SHA256:/{print $2; exit}')"
          echo "Signing certificate SHA-256: $ACTUAL_FP"
          test "$ACTUAL_FP" = "$EXPECTED_FP"

          cat > keystore.properties <<EOF
          storeFile=$KEYSTORE
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF
          chmod 600 keystore.properties

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Stamp aa1.39-test15 Video EXP version
        run: |
          set -euxo pipefail
          sed -i 's/versionCode 2408/versionCode 2423/' smarttubetv/build.gradle
          sed -i 's/-mobile-p13-aa1.24/-mobile-p13-aa1.39-test15/' smarttubetv/build.gradle
          grep -n 'versionCode\|mobile-p13-aa1.39-test15\|carvideo' smarttubetv/build.gradle

      - name: Build SmartTube AA Video EXP APKs
        run: >-
          ./gradlew :smarttubetv:assembleStmobileCarvideo
          --stacktrace
          --console=plain
          --no-daemon
          --max-workers=1
          --no-parallel

      - name: Prepare direct-download Video EXP APK files
        run: |
          set -euxo pipefail
          OUT=smarttubetv/build/outputs/apk/stmobile/carvideo
          mkdir -p release-video-exp
          cp "$(find "$OUT" -maxdepth 1 -type f -name '*_universal.apk' -print -quit)" release-video-exp/SmartTube-AA-Video-EXP-universal.apk
          cp "$(find "$OUT" -maxdepth 1 -type f -name '*_arm64-v8a.apk' -print -quit)" release-video-exp/SmartTube-AA-Video-EXP-arm64-v8a.apk
          cp "$(find "$OUT" -maxdepth 1 -type f -name '*_armeabi-v7a.apk' -print -quit)" release-video-exp/SmartTube-AA-Video-EXP-armeabi-v7a.apk
          (cd release-video-exp && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh release-video-exp

      - name: Verify published APK signing certificate
        run: |
          set -euo pipefail
          EXPECTED_FP="50:B0:29:CB:A8:6A:91:58:51:B0:64:0C:B0:DF:42:83:BB:EE:12:EA:7E:DB:C0:06:1C:9B:D4:C6:1C:0E:C9:C5"
          for APK in release-video-exp/*.apk; do
            ACTUAL_FP="$(keytool -printcert -jarfile "$APK" | awk -F'SHA256: ' '/SHA256:/{print $2; exit}')"
            echo "$APK -> $ACTUAL_FP"
            test "$ACTUAL_FP" = "$EXPECTED_FP"
          done

      - name: Publish direct Video EXP APK downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="latest-video-exp"
          TITLE="SmartTube AA Video EXP aa1.39-test15 - latest main"
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<'EOF'
          Najnowszy automatyczny build SmartTube AA Video EXP z gałęzi main.

          Pobieraj pliki APK bezpośrednio z Assets - bez ZIP-a:
          - SmartTube-AA-Video-EXP-universal.apk - zalecany dla większości użytkowników
          - SmartTube-AA-Video-EXP-arm64-v8a.apk - urządzenia ARM64
          - SmartTube-AA-Video-EXP-armeabi-v7a.apk - starsze urządzenia ARMv7

          APK jest podpisane tym samym certyfikatem co publiczne aa1.23, aby zachować aktualizacje bez odinstalowywania.
          Video EXP używa tej samej bazy aa1.39 i tego samego multi-audio/SABR pipeline co Music,
          ale pozostaje osobnym eksperymentalnym pakietem app.smarttube.mobile.carvideo.
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .id)"
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              -f name="$TITLE" -f body="$(cat "$NOTES_FILE")" -F prerelease=true -f make_latest=false >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
              -f name="$TITLE" -f body="$(cat "$NOTES_FILE")" \
              -F draft=false -F prerelease=true -f make_latest=false >/dev/null
          fi

          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            release-video-exp/SmartTube-AA-Video-EXP-universal.apk \
            release-video-exp/SmartTube-AA-Video-EXP-arm64-v8a.apk \
            release-video-exp/SmartTube-AA-Video-EXP-armeabi-v7a.apk \
            release-video-exp/SHA256SUMS.txt

      - name: Upload Video EXP universal APK to Actions archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube-AA-Video-EXP-${{ github.ref_name }}-universal
          path: smarttubetv/build/outputs/apk/stmobile/carvideo/*_universal.apk
          if-no-files-found: error

      - name: Upload Video EXP ARM64 APK to Actions archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube-AA-Video-EXP-${{ github.ref_name }}-arm64-v8a
          path: smarttubetv/build/outputs/apk/stmobile/carvideo/*_arm64-v8a.apk
          if-no-files-found: error

      - name: Upload Video EXP ARMv7 APK to Actions archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube-AA-Video-EXP-${{ github.ref_name }}-armeabi-v7a
          path: smarttubetv/build/outputs/apk/stmobile/carvideo/*_armeabi-v7a.apk
          if-no-files-found: error
