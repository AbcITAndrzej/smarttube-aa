name: Build SmartTube AA APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - "chatgpt-aa1.30-sabr-av-multiaudio"

permissions:
  contents: write

jobs:
  build-stmobile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout public monorepo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Apply and commit aa1.30 runtime patches
        run: |
          set -euxo pipefail
          for patch in .github/aa130-01.patch .github/aa130-02.patch .github/aa130-03.patch .github/aa130-04.patch .github/aa130-05.patch; do
            git apply --check "$patch"
          done
          for patch in .github/aa130-01.patch .github/aa130-02.patch .github/aa130-03.patch .github/aa130-04.patch .github/aa130-05.patch; do
            git apply "$patch"
          done
          git rm .github/aa130-01.patch .github/aa130-02.patch .github/aa130-03.patch .github/aa130-04.patch .github/aa130-05.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MediaServiceCore/youtubeapi/src/main/java/com/liskovsoft/youtubeapi/videoinfo/VideoInfoServiceBase.java
          git add exoplayer-amzn-2.10.6/library/sabr/src/main/java/com/google/android/exoplayer2/source/sabr/manifest/SabrManifest.java
          git add exoplayer-amzn-2.10.6/library/sabr/src/main/java/com/google/android/exoplayer2/source/sabr/parser/SabrStream.java
          git add smarttubetv/src/stmobile/java/com/liskovsoft/smartyoutubetv2/tv/ui/mobile/nativeui/legacy/LegacyMobilePlaybackRepository.java
          git add smarttubetv/src/stmobile/java/com/liskovsoft/smartyoutubetv2/tv/ui/mobile/nativeui/player/MobileInstantPlayController.java
          git commit -m "V15: full A/V SABR multi-audio and diagnostics [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Set up Java 11
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Stamp aa1.30 test version
        run: |
          set -euxo pipefail
          sed -i 's/versionCode 2408/versionCode 2414/' smarttubetv/build.gradle
          sed -i 's/-mobile-p13-aa1.24/-mobile-p13-aa1.30-test6/' smarttubetv/build.gradle
          grep -n 'versionCode\|mobile-p13-aa1.30-test6' smarttubetv/build.gradle

      - name: Build SmartTube mobile AA APKs
        run: >-
          ./gradlew :smarttubetv:assembleStmobileDebug
          --stacktrace
          --console=plain
          --no-daemon
          --max-workers=1
          --no-parallel

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube-AA-${{ github.ref_name }}-arm64-v8a
          path: smarttubetv/build/outputs/apk/stmobile/debug/*_arm64-v8a.apk
          if-no-files-found: error

      - name: Upload universal APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube-AA-${{ github.ref_name }}-universal
          path: smarttubetv/build/outputs/apk/stmobile/debug/*_universal.apk
          if-no-files-found: error

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube-AA-${{ github.ref_name }}-armeabi-v7a
          path: smarttubetv/build/outputs/apk/stmobile/debug/*_armeabi-v7a.apk
          if-no-files-found: error
