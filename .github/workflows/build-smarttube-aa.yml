name: Build SmartTube AA APK

on:
  workflow_dispatch:
  push:
    branches:
      - "chatgpt-aa1.35-auth-preserve-3238-recovery"

permissions:
  contents: read

jobs:
  build-stmobile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout public monorepo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Apply auth-preserving official 32.38 recovery
        run: |
          set -euxo pipefail
          AUTH_FILE=MediaServiceCore/youtubeapi/src/main/java/com/liskovsoft/youtubeapi/service/YouTubeSignInService.java
          AUTH_BEFORE=$(sha256sum "$AUTH_FILE" | awk '{print $1}')
          python3 .github/aa135_apply_official_3238_recovery.py
          AUTH_AFTER=$(sha256sum "$AUTH_FILE" | awk '{print $1}')
          test "$AUTH_BEFORE" = "$AUTH_AFTER"
          grep -n 'switchNextClientNow' common/src/main/java/com/liskovsoft/smartyoutubetv2/common/app/models/playback/controllers/ErrorFixerController.java
          grep -n 'P18_OFFICIAL_3238\|switchNextFormat(boolean force)' MediaServiceCore/youtubeapi/src/main/java/com/liskovsoft/youtubeapi/videoinfo/V2/VideoInfoService.java
          grep -n 'P18-Official3238' smarttubetv/src/stmobile/java/com/liskovsoft/smartyoutubetv2/tv/ui/mobile/nativeui/legacy/LegacyMobilePlaybackRepository.java
          git diff --name-only

      - name: Set up Java 11
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Stamp aa1.35 test version
        run: |
          set -euxo pipefail
          sed -i 's/versionCode 2408/versionCode 2418/' smarttubetv/build.gradle
          sed -i 's/-mobile-p13-aa1.24/-mobile-p13-aa1.35-test10/' smarttubetv/build.gradle
          grep -n 'versionCode\|mobile-p13-aa1.35-test10' smarttubetv/build.gradle

      - name: Build SmartTube mobile AA APKs
        run: >-
          ./gradlew :smarttubetv:assembleStmobileDebug
          --stacktrace
          --console=plain
          --no-daemon
          --max-workers=1
          --no-parallel

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube-AA-${{ github.ref_name }}-arm64-v8a
          path: smarttubetv/build/outputs/apk/stmobile/debug/*_arm64-v8a.apk
          if-no-files-found: error

      - name: Upload universal APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube-AA-${{ github.ref_name }}-universal
          path: smarttubetv/build/outputs/apk/stmobile/debug/*_universal.apk
          if-no-files-found: error

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube-AA-${{ github.ref_name }}-armeabi-v7a
          path: smarttubetv/build/outputs/apk/stmobile/debug/*_armeabi-v7a.apk
          if-no-files-found: error
