name: Build SmartTube AA APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - "chatgpt-aa1.31-sabr-xtags-multiaudio"

permissions:
  contents: write

jobs:
  build-stmobile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout public monorepo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Apply and commit aa1.31 runtime fix
        run: |
          set -euxo pipefail
          python3 -m py_compile .github/aa131_apply.py
          python3 .github/aa131_apply.py
          git rm .github/aa131_apply.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MediaServiceCore/mediaserviceinterfaces/src/main/java/com/liskovsoft/mediaserviceinterfaces/data/MediaFormat.java
          git add MediaServiceCore/youtubeapi/src/main/java/com/liskovsoft/youtubeapi/videoinfo/models/formats/VideoFormat.java
          git add MediaServiceCore/youtubeapi/src/main/java/com/liskovsoft/youtubeapi/service/data/YouTubeMediaFormat.java
          git add MediaServiceCore/youtubeapi/src/main/java/com/liskovsoft/youtubeapi/innertube/models/PlayerResult.kt
          git add MediaServiceCore/youtubeapi/src/main/java/com/liskovsoft/youtubeapi/innertube/impl/MediaFormatImpl.kt
          git add MediaServiceCore/youtubeapi/src/main/java/com/liskovsoft/youtubeapi/videoinfo/VideoInfoServiceBase.java
          git add exoplayer-amzn-2.10.6/library/sabr/src/main/java/com/google/android/exoplayer2/source/sabr/manifest/SabrManifestParser.java
          git add exoplayer-amzn-2.10.6/library/sabr/src/main/java/com/google/android/exoplayer2/source/sabr/manifest/SabrManifest.java
          git add exoplayer-amzn-2.10.6/library/sabr/src/main/java/com/google/android/exoplayer2/source/sabr/parser/models/FormatSelector.java
          git add exoplayer-amzn-2.10.6/library/sabr/src/main/java/com/google/android/exoplayer2/source/sabr/parser/SabrProcessor.java
          git add exoplayer-amzn-2.10.6/library/sabr/src/main/java/com/google/android/exoplayer2/source/sabr/parser/SabrStream.java
          git add exoplayer-amzn-2.10.6/library/sabr/src/main/java/com/google/android/exoplayer2/source/sabr/DefaultSabrChunkSource.java
          git diff --cached --check
          git commit -m "V16: preserve SABR xtags and exact multi-audio identity [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Set up Java 11
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Stamp aa1.31 test version
        run: |
          set -euxo pipefail
          sed -i 's/versionCode 2408/versionCode 2415/' smarttubetv/build.gradle
          sed -i 's/-mobile-p13-aa1.24/-mobile-p13-aa1.31-test7/' smarttubetv/build.gradle
          grep -n 'versionCode\|mobile-p13-aa1.31-test7' smarttubetv/build.gradle

      - name: Build SmartTube mobile AA APKs
        run: >-
          ./gradlew :smarttubetv:assembleStmobileDebug
          --stacktrace
          --console=plain
          --no-daemon
          --max-workers=1
          --no-parallel

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube-AA-${{ github.ref_name }}-arm64-v8a
          path: smarttubetv/build/outputs/apk/stmobile/debug/*_arm64-v8a.apk
          if-no-files-found: error

      - name: Upload universal APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube-AA-${{ github.ref_name }}-universal
          path: smarttubetv/build/outputs/apk/stmobile/debug/*_universal.apk
          if-no-files-found: error

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube-AA-${{ github.ref_name }}-armeabi-v7a
          path: smarttubetv/build/outputs/apk/stmobile/debug/*_armeabi-v7a.apk
          if-no-files-found: error
