name: Validate aa1.40 Shorts SABR VOD EOS fix

on:
  workflow_dispatch:
  push:
    branches:
      - "fix/shorts-sabr-vod-eos"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Java 11
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Apply aa1.40 playback stack
        run: |
          set -euxo pipefail
          python3 .github/aa140_apply_vod_eos_guard.py
          grep -n 'VOD_END_TOLERANCE_MS\|SABR VOD EOS' exoplayer-amzn-2.10.6/library/sabr/src/main/java/com/google/android/exoplayer2/source/sabr/DefaultSabrChunkSource.java
          grep -n 'if (!manifest.dynamic && periodEnded)' exoplayer-amzn-2.10.6/library/sabr/src/main/java/com/google/android/exoplayer2/source/sabr/DefaultSabrChunkSource.java
          grep -n 'out.endOfStream = true' exoplayer-amzn-2.10.6/library/sabr/src/main/java/com/google/android/exoplayer2/source/sabr/DefaultSabrChunkSource.java

      - name: Build Music and Video EXP without publishing
        run: |
          chmod +x gradlew
          ./gradlew :smarttubetv:assembleStmobileDebug :smarttubetv:assembleStmobileCarvideo \
            --stacktrace --console=plain --no-daemon --max-workers=1 --no-parallel
