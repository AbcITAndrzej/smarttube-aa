name: Build standalone AA Suite test APKs

on:
  push:
    branches:
      - experiment/android-auto-surface-aasuite-2026-10
    paths:
      - ".github/workflows/test-build-aasuite.yml"
      - ".gitmodules"
      - "experiments/aasuite"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned upstream submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 35 and 36
        run: sdkmanager --install "platforms;android-35" "platforms;android-36" "build-tools;36.0.0"
      - name: Compile original AA Suite and companion debug APKs
        working-directory: experiments/aasuite
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :companion:assembleDebug --no-daemon --stacktrace
      - name: Collect original debug APKs
        run: |
          mkdir -p out
          cp experiments/aasuite/app/build/outputs/apk/debug/app-debug.apk out/AA-Suite-0.9-debug.apk
          cp experiments/aasuite/companion/build/outputs/apk/debug/companion-debug.apk out/AA-Share-0.1-debug.apk
          sha256sum out/*.apk | tee out/SHA256SUMS.txt
      - name: Upload test APKs
        uses: actions/upload-artifact@v4
        with:
          name: AA-Suite-original-debug-APKs
          path: out/*
          retention-days: 7
          if-no-files-found: error
