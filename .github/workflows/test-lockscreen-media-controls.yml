name: Test lockscreen media controls

on:
  workflow_dispatch:
  push:
    branches:
      - "test/lockscreen-media-controls"

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Apply aa1.40 playback stack and lockscreen test patch
        run: |
          set -euxo pipefail
          python3 .github/aa140_apply_vod_eos_guard.py
          python3 .github/aa141_apply_lockscreen_media_controls.py
          grep -n 'ACTION_SKIP_TO_PREVIOUS\|ACTION_SKIP_TO_NEXT' smarttubetv/src/stmobile/java/com/liskovsoft/smartyoutubetv2/tv/ui/mobile/nativeui/background/MobileMediaSessionManager.java
          grep -n 'METADATA_KEY_ALBUM_ART_URI\|METADATA_KEY_ART_URI' smarttubetv/src/stmobile/java/com/liskovsoft/smartyoutubetv2/tv/ui/mobile/nativeui/background/MobileMediaSessionManager.java
          grep -n 'playPreviousFromSystem\|playNextFromSystem' smarttubetv/src/stmobile/java/com/liskovsoft/smartyoutubetv2/tv/ui/mobile/nativeui/legacy/LegacyMobilePlaybackRepository.java
          grep -n 'getArtworkUrl' smarttubetv/src/stmobile/java/com/liskovsoft/smartyoutubetv2/tv/ui/mobile/nativeui/model/MobilePlaybackSnapshot.java

      - name: Set up Java 11
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Restore stable SmartTube AA signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SMARTTUBE_AA_SIGNING_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "${SIGNING_KEYSTORE_B64:-}"
          KEYSTORE="$RUNNER_TEMP/smarttube-aa-signing.keystore"
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          EXPECTED_FP="50:B0:29:CB:A8:6A:91:58:51:B0:64:0C:B0:DF:42:83:BB:EE:12:EA:7E:DB:C0:06:1C:9B:D4:C6:1C:0E:C9:C5"
          ACTUAL_FP="$(keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey | awk -F'SHA256: ' '/SHA256:/{print $2; exit}')"
          echo "Signing certificate SHA-256: $ACTUAL_FP"
          test "$ACTUAL_FP" = "$EXPECTED_FP"

          cat > keystore.properties <<EOF
          storeFile=$KEYSTORE
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF
          chmod 600 keystore.properties

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Stamp aa1.41-lockscreen-test1 version
        run: |
          set -euxo pipefail
          sed -i 's/versionCode 2408/versionCode 2426/' smarttubetv/build.gradle
          sed -i 's/-mobile-p13-aa1.24/-mobile-p13-aa1.41-lockscreen-test1/' smarttubetv/build.gradle
          grep -n 'versionCode\|aa1.41-lockscreen-test1' smarttubetv/build.gradle

      - name: Build Music and Video EXP test APKs
        run: >-
          ./gradlew :smarttubetv:assembleStmobileDebug :smarttubetv:assembleStmobileCarvideo
          --stacktrace
          --console=plain
          --no-daemon
          --max-workers=1
          --no-parallel

      - name: Prepare direct test APK files
        run: |
          set -euxo pipefail
          MUSIC_OUT=smarttubetv/build/outputs/apk/stmobile/debug
          VIDEO_OUT=smarttubetv/build/outputs/apk/stmobile/carvideo
          mkdir -p test-apk
          cp "$(find "$MUSIC_OUT" -maxdepth 1 -type f -name '*_arm64-v8a.apk' -print -quit)" test-apk/SmartTube-AA-Music-aa1.41-lockscreen-test1-arm64-v8a.apk
          cp "$(find "$VIDEO_OUT" -maxdepth 1 -type f -name '*_arm64-v8a.apk' -print -quit)" test-apk/SmartTube-AA-Video-EXP-aa1.41-lockscreen-test1-arm64-v8a.apk
          ls -lh test-apk

      - name: Verify test APK signing certificate
        run: |
          set -euo pipefail
          EXPECTED_FP="50:B0:29:CB:A8:6A:91:58:51:B0:64:0C:B0:DF:42:83:BB:EE:12:EA:7E:DB:C0:06:1C:9B:D4:C6:1C:0E:C9:C5"
          for APK in test-apk/*.apk; do
            ACTUAL_FP="$(keytool -printcert -jarfile "$APK" | awk -F'SHA256: ' '/SHA256:/{print $2; exit}')"
            echo "$APK -> $ACTUAL_FP"
            test "$ACTUAL_FP" = "$EXPECTED_FP"
          done

      - name: Publish direct prerelease APK links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="aa1.41-lockscreen-test1"
          TITLE="SmartTube AA aa1.41-lockscreen-test1 - lockscreen controls"
          NOTES="Test-only build from test/lockscreen-media-controls. Adds Previous / Play-Pause / Next lockscreen controls and artwork metadata to the shared mobile MediaSession. Not production."

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .id)"
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              -f name="$TITLE" -f body="$NOTES" -F prerelease=true -f make_latest=false >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
              -f name="$TITLE" -f body="$NOTES" \
              -F draft=false -F prerelease=true -f make_latest=false >/dev/null
          fi

          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            test-apk/SmartTube-AA-Music-aa1.41-lockscreen-test1-arm64-v8a.apk \
            test-apk/SmartTube-AA-Video-EXP-aa1.41-lockscreen-test1-arm64-v8a.apk

      - name: Upload Music test APK archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube-AA-Music-aa1.41-lockscreen-test1-arm64-v8a
          path: test-apk/SmartTube-AA-Music-aa1.41-lockscreen-test1-arm64-v8a.apk
          if-no-files-found: error

      - name: Upload Video EXP test APK archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube-AA-Video-EXP-aa1.41-lockscreen-test1-arm64-v8a
          path: test-apk/SmartTube-AA-Video-EXP-aa1.41-lockscreen-test1-arm64-v8a.apk
          if-no-files-found: error
